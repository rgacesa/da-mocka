name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build
      - run: |
          da-mocka demo --output work/ci --n-samples 100 --seed 42
          da-mocka check-input --config work/ci/config.yaml
          da-mocka generate --config work/ci/config.yaml --output work/mock --n-samples 150
          da-mocka check-input --config work/mock/config.yaml
          da-mocka generate --config work/ci/config.yaml --output work/stratified --n-samples 100 --stratify disease sex --include disease=A,control --balance disease --min-stratum-size 2
          da-mocka check-input --config work/stratified/config.yaml
